# GitHub Secret Scanner Pro - Файл конфигурации
# Внешняя конфигурация, удобная для настройки параметров

# ============================================================================
#                          Конфигурация сканера
# ============================================================================
scanner:
  # Порог энтропии (ключи ниже этого значения считаются тестовыми данными)
  entropy_threshold: 3.8

  # Максимальный размер файла (KB)
  max_file_size_kb: 500

  # Параллельность асинхронной загрузки
  async_download_concurrency: 60

  # Контекстное окно (по N строк до и после)
  context_window: 10

# ============================================================================
#                          Конфигурация валидатора
# ============================================================================
validator:
  # Максимальная параллельность
  max_concurrency: 100

  # Таймаут запроса (секунды)
  request_timeout: 15

  # Количество рабочих потоков
  num_workers: 2

# ============================================================================
#                          Конфигурация базы данных
# ============================================================================
database:
  # Путь к базе данных
  db_path: "leaked_keys.db"

  # Размер пакетной записи
  batch_size: 50

  # Интервал обновления (секунды)
  flush_interval: 5.0

# ============================================================================
#                          Конфигурация прерывателя цепи
# ============================================================================
circuit_breaker:
  # Включено
  enabled: true

  # Порог последовательных ошибок
  failure_threshold: 5

  # Время восстановления прерывателя (секунды)
  recovery_timeout: 60

  # Количество пробных запросов в полуоткрытом состоянии
  half_open_requests: 3

# ============================================================================
#                          Чёрный список доменов
# ============================================================================
blacklist:
  domains:
    - localhost
    - 127.0.0.1
    - 0.0.0.0
    - example.com
    - test.com
    - my-api
    - your-api
    - xxx
    - placeholder
    - fake
    - dummy
    - sample
    - mock
    - staging.
    - sandbox.
    - dev.
    - demo.
    - test.
    - .local
    - .internal
    - ngrok.io
    - localtunnel

  paths:
    - /test/
    - /tests/
    - /__tests__/
    - /spec/
    - /specs/
    - /mock/
    - /mocks/
    - /__mocks__/
    - /fixture/
    - /fixtures/
    - /example/
    - /examples/
    - /sample/
    - /samples/
    - /demo/
    - /demos/
    - /doc/
    - /docs/
    - /vendor/
    - /node_modules/
    - /venv/
    - /.venv/
    - /dist/
    - /build/
    - /out/
    - /coverage/
    - /.github/ISSUE_TEMPLATE/
    - /sandbox/
    - /playground/
    - /staging/
    - /tutorial/
    - /tutorials/
    - /workshop/
    - /workshops/
    - /boilerplate/
    - /starter/

# ============================================================================
#                          Фильтр расширений файлов
# ============================================================================
file_filter:
  # Разрешённые расширения
  allowed_extensions:
    - .py
    - .js
    - .ts
    - .jsx
    - .tsx
    - .env
    - .env.local
    - .env.production
    - .env.development
    - .yml
    - .yaml
    - .toml
    - .sh
    - .bash
    - .zsh
    - .php
    - .rb
    - .go
    - .rs
    - .java
    - .conf
    - .cfg
    - .ini
    - .dockerfile

  # Заблокированные расширения
  blocked_extensions:
    - .lock
    - .min.js
    - .min.css
    - .map
    - .md
    - .rst
    - .txt
    - .html
    - .htm
    - .css
    - .scss
    - .less
    - .svg
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .ico
    - .woff
    - .woff2
    - .ttf
    - .eot
    - .pdf
    - .doc
    - .docx
    - .xls
    - .xlsx
    - .zip
    - .tar
    - .gz
    - .rar
    - .exe
    - .dll
    - .so
    - .dylib
    - .pyc
    - .pyo
    - .class
    - .ipynb
    - .csv

# ============================================================================
#                          Мониторинг производительности
# ============================================================================
monitoring:
  # Включить метрики Prometheus
  enable_prometheus: false

  # Порт Prometheus
  prometheus_port: 8000

  # Интервал вывода статистики (секунды)
  stats_interval: 60

# ============================================================================
#                          Конфигурация журнала
# ============================================================================
logging:
  # Уровень журнала (DEBUG/INFO/WARNING/ERROR)
  level: INFO

  # Выводить ли в файл
  log_to_file: false

  # Путь к файлу журнала
  log_file: "scanner.log"
